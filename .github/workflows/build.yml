name: JavaCI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Read toolchain versions
        id: toolchain
        run: |
          grep '^java-version=' nbproject/platform.properties >> "$GITHUB_OUTPUT"

      - name: Set up pinned JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: ${{ steps.toolchain.outputs.java-version }}
          cache: gradle

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install --yes ant

      - name: Cache NetBeans distribution
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: netbeans-plat/downloads
          key: netbeans-${{ runner.os }}-${{ hashFiles('nbproject/platform.properties', 'nbproject/platform.xml') }}

      - name: Run headless tests
        run: ./gradlew -p gradle check

      - name: Build release ZIP without NetBeans IDE
        run: ant clean build-zip

      - name: Upload release ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trgtd
          path: dist/trgtd.zip
          if-no-files-found: error
