name: JavaCI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v4

      - name: Read toolchain versions
        id: toolchain
        run: |
          grep '^java-version=' nbproject/platform.properties >> "$GITHUB_OUTPUT"

      - name: Set up pinned JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.toolchain.outputs.java-version }}
          cache: gradle

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install --yes ant

      - name: Cache NetBeans distribution
        uses: actions/cache@v4.2.3
        with:
          path: netbeans-plat/downloads
          key: netbeans-${{ runner.os }}-${{ hashFiles('nbproject/platform.properties', 'nbproject/platform.xml') }}

      - name: Run headless tests
        run: ./gradlew -p gradle check

      - name: Build release ZIP without NetBeans IDE
        run: ant clean build-zip

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4.6.2
        with:
          name: trgtd
          path: dist/trgtd.zip
          if-no-files-found: error
