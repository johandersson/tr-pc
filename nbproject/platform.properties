# Derived from the application cluster with JDK 17 jdeps. The jdk.* modules
# cover providers loaded dynamically rather than through static references.
windows-runtime-modules=java.base,java.compiler,java.desktop,java.instrument,java.management.rmi,java.prefs,java.scripting,java.security.sasl,java.sql.rowset,jdk.unsupported,jdk.charsets,jdk.crypto.ec,jdk.localedata,jdk.xml.dom,jdk.zipfs

cluster.path=\
    ${nbplatform.active.dir}/harness:\
    ${nbplatform.active.dir}/platform

disabled.modules=\
    org.netbeans.libs.testng,\
    org.netbeans.modules.core.kit,\
    org.netbeans.modules.htmlui,\
    org.netbeans.modules.keyring.impl,\
    org.netbeans.modules.masterfs.nio2,\
    org.netbeans.modules.netbinox,\
    org.netbeans.modules.templatesui,\
    org.netbeans.modules.uihandler,\
    org.objectweb.asm,\
    org.objectweb.asm.commons,\
    org.objectweb.asm.tree
nbplatform.active=default
