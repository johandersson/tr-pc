windows-jdk-version=17.0.20.1+1
windows-jdk-archive-name=OpenJDK17U-jdk_x64_windows_hotspot_17.0.20.1_1.zip
windows-jdk-url=https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/${windows-jdk-archive-name}
