branding.token=trgtd

netbeans-plat-version=25
java-version=17
ant-minimum-version=1.10.14
ant.build.javac.source=${java-version}
ant.build.javac.target=${java-version}
javac.source=${java-version}
javac.target=${java-version}

suite.dir=${basedir}
nbplatform.active.dir=${suite.dir}/netbeans-plat/${netbeans-plat-version}
harness.dir=${nbplatform.active.dir}/harness

netbeans.distribution.url=https://archive.apache.org/dist/netbeans/netbeans/${netbeans-plat-version}/netbeans-${netbeans-plat-version}-bin.zip
